name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: git identity for temp repos
        run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: unit + integration tests (Docker is available on ubuntu runners)
        run: python -m unittest discover -s tests -v
      - name: shared guard contract
        run: python -m unittest tests.test_guard -v
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: tests (compose tests skip without Docker)
        run: python -m unittest discover -s tests -v
