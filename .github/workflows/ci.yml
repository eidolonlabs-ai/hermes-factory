name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: git identity for temp repos
        run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: unit + integration tests (Docker is available on ubuntu runners)
        run: python -m unittest discover -s tests -v
      - name: shared guard contract
        run: python -m unittest tests.test_guard -v
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: install the wheel (not editable) and use it away from the checkout
        run: |
          pip install .
          cd "$(mktemp -d)"
          factory --version
          git init -q -b main proj && cd proj
          factory init --no-commit
          test -f AGENTS.md && test -f scripts/verify.sh && test -f .factory/config.json
          echo '{"tool_name":"terminal","tool_input":{"command":"git push"},"cwd":"."}' | factory-hook hermes | grep -q '"block"'
          HERMES_HOME="$PWD/.hh" factory setup --no-profiles
          test -f .hh/skills/software-factory/factory/SKILL.md
          test -f .hh/skills/software-factory/factory/templates/audit/run.sh
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: tests (compose tests skip without Docker)
        run: python -m unittest discover -s tests -v
