[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-agent-factory"
dynamic = ["version"]
description = "Unattended milestone builds: Hermes orchestrates Claude Code / Codex, an external gate decides."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mark Castillo" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/eidolonlabs-ai/hermes-factory"

[project.scripts]
factory = "factory.cli:main"
factory-hook = "factory.hooks_adapters:main"

[tool.hatch.version]
path = "factory/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

# Data the CLI needs at runtime; factory/resources.py finds it here or in a checkout.
[tool.hatch.build.targets.wheel.force-include]
"template" = "factory/_data/template"
"hermes/plugin" = "factory/_data/plugin"
"profiles" = "factory/_data/profiles"

[tool.hatch.build.targets.sdist]
include = ["factory", "template", "hermes", "profiles", "contract", "README.md", "LICENSE", "CONTRACT.md", "DESIGN.md"]
