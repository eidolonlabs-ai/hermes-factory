[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-agent-harness"
dynamic = ["version"]
description = "Unattended milestone builds: Hermes orchestrates Claude Code / Codex, an external gate decides."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mark Castillo" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/theRealMarkCastillo/hermes-agent-harness"

[project.scripts]
harness = "harness.cli:main"
harness-hook = "harness.hooks_adapters:main"

[tool.hatch.version]
path = "harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

# Data the CLI needs at runtime; harness/resources.py finds it here or in a checkout.
[tool.hatch.build.targets.wheel.force-include]
"template" = "harness/_data/template"
"hermes/plugin" = "harness/_data/plugin"
"profiles" = "harness/_data/profiles"

[tool.hatch.build.targets.sdist]
include = ["harness", "template", "hermes", "profiles", "contract", "README.md", "LICENSE", "CONTRACT.md", "DESIGN.md"]
